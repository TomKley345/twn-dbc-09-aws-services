buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.2.1'
  }
}

apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'org.springframework.boot'

repositories {
  mavenCentral()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

dependencies {
  implementation(
      "org.springframework.boot:spring-boot-starter-web:3.2.1",
      "org.springframework.boot:spring-boot-devtools:3.2.1"
  )
  testImplementation(
      "org.springframework.boot:spring-boot-starter-test:3.2.1",
      "org.spockframework:spock-spring:2.3-groovy-4.0"
  )
}

tasks.withType(Test) {
  testLogging {
    exceptionFormat = 'full'
    events 'passed', 'skipped', 'failed'
  }
}
