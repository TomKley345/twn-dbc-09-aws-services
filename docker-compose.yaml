services:
  java-maven-app:
    image: tomkley/demo-app:${IMAGE}
    ports:
      - 8080:8080
  postgres:
    image: postgres:18
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: my-pwd
